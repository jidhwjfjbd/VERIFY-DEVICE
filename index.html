<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying your device...</title>
  <!-- مكتبة تلجرام الرسمية -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- مكتبة استخراج بصمة الجهاز -->
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #0d0e1b 0%, #12142d 100%);
      color: #ffffff;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 16px; dir: ltr;
    }
    .card {
      background: rgba(23, 26, 48, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px; padding: 28px 20px;
      width: 100%; max-width: 380px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .avatar-icon {
      width: 80px; height: 80px; margin: 0 auto 16px;
      background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 38px; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
      position: relative;
    }
    .avatar-icon::after {
      content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
      border-radius: 50%; border: 2px solid transparent;
      border-top-color: #60a5fa; border-right-color: #60a5fa;
      animation: spin 2s linear infinite;
    }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p.sub-title { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    
    /* Progress Bar */
    .progress-container {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px; height: 6px; width: 100%;
      margin-bottom: 12px; overflow: hidden; position: relative;
    }
    .progress-bar {
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      height: 100%; width: 0%; transition: width 0.4s ease;
      border-radius: 10px;
    }
    .status-text {
      font-size: 12px; color: #cbd5e1; margin-bottom: 24px; min-height: 18px;
    }

    /* Steps List */
    .steps-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .step-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      font-size: 14px; color: #64748b; transition: all 0.3s ease;
    }
    .step-item.active {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.3);
      color: #ffffff; font-weight: 600;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.15);
    }
    .step-item.completed {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.2);
      color: #e2e8f0;
    }
    
    .icon-box {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold; background: rgba(255, 255, 255, 0.05);
    }
    .step-item.active .icon-box {
      border: 2px solid #3b82f6; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.8s linear infinite; background: transparent;
    }
    .step-item.completed .icon-box {
      background: #10b981; color: #ffffff;
    }

    .footer-note { font-size: 11px; color: #64748b; line-height: 1.4; direction: rtl; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-icon">🧐</div>
    <h2>PandaStore</h2>
    <p class="sub-title">Verifying your device to ensure system integrity...</p>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div id="status-text" class="status-text">Initializing security protocols...</div>

    <!-- Steps -->
    <div class="steps-container">
      <div id="step-1" class="step-item">
        <div class="icon-box"></div>
        <span>System initialization</span>
      </div>
      <div id="step-2" class="step-item">
        <div class="icon-box"></div>
        <span>Device fingerprinting</span>
      </div>
      <div id="step-3" class="step-item">
        <div class="icon-box"></div>
        <span>Secure authentication</span>
      </div>
      <div id="step-4" class="step-item">
        <div class="icon-box"></div>
        <span>Final result</span>
      </div>
    </div>

    <div class="footer-note">
      PandaStore مدعوم بتقنية التشفير المتطورة من، معلوماتك محمية بالكامل ولا تشارك مع أي طرف ثالث.
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('uid');

    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status-text');

    function updateStep(stepNum, state) {
      const el = document.getElementById(`step-${stepNum}`);
      const iconBox = el.querySelector('.icon-box');
      if (state === 'active') {
        el.className = 'step-item active';
        iconBox.innerHTML = '';
      } else if (state === 'completed') {
        el.className = 'step-item completed';
        iconBox.innerHTML = '✓';
      }
    }

    async function runVerificationProcess() {
      let visitorId = "unknown";

      // الخطوة 1: System initialization (0% -> 25%)
      updateStep(1, 'active');
      progressBar.style.width = '15%';
      statusText.innerText = 'Connecting to verification node...';
      await new Promise(r => setTimeout(r, 900));
      updateStep(1, 'completed');

      // الخطوة 2: Device fingerprinting (25% -> 60%)
      updateStep(2, 'active');
      progressBar.style.width = '45%';
      statusText.innerText = 'Analyzing and generating device fingerprint...';
      
      try {
        const fp = await FingerprintJS.load();
        const result = await fp.get();
        visitorId = result.visitorId;
      } catch (e) {
        visitorId = "gen_" + Math.random().toString(36).substring(2, 10);
      }
      
      await new Promise(r => setTimeout(r, 1200));
      updateStep(2, 'completed');

      // الخطوة 3: Secure authentication (60% -> 85%)
      updateStep(3, 'active');
      progressBar.style.width = '75%';
      statusText.innerText = 'Encrypting and sending device payload...';

      const payload = JSON.stringify({
        action: "verify_device",
        device_id: visitorId,
        user_id: userId
      });

      if (tg && tg.sendData) {
        tg.sendData(payload);
      }
      
      await new Promise(r => setTimeout(r, 1000));
      updateStep(3, 'completed');

      // الخطوة 4: Final result (100%)
      updateStep(4, 'active');
      progressBar.style.width = '100%';
      statusText.innerText = 'Authentication successful! Closing window...';
      await new Promise(r => setTimeout(r, 800));
      updateStep(4, 'completed');

      // إغلاق النافذة بعد الاكتفاء
      setTimeout(() => {
        if (tg) tg.close();
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(runVerificationProcess, 400);
    });
  </script>

</body>
                                                    </html>
