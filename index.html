<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZORRO - توثيق أمان الجهاز</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  <style>
    body {
      background-color: #17212b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background-color: #242f3d;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      max-width: 350px;
      width: 100%;
    }
    h2 {
      margin: 10px 0 5px 0;
      color: #ffffff;
      font-size: 22px;
    }
    p {
      color: #7f91a4;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn {
      background-color: #2ea6ff;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    .btn:disabled {
      background-color: #526373;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      font-size: 13px;
      color: #f1a80a;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- اسم الصفحة الجديد -->
    <h2>ZORRO</h2>
    <p>اضغط على الزر أدناه لتأكيد أمان جهازك وإعادة توجيهك للبوت تلقائياً.</p>

    <button id="verifyBtn" class="btn" onclick="verifyDevice()">🛡️ تأكيد أمان الجهاز</button>
    <div id="status"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function verifyDevice() {
      const btn = document.getElementById('verifyBtn');
      const status = document.getElementById('status');

      btn.disabled = true;
      status.innerText = "جاري فحص أمان الجهاز...";

      try {
        const fp = await FingerprintJS.load();
        const result = await fp.get();
        const visitorId = result.visitorId;

        status.innerText = "تم الفحص بنجاح! جاري الإرسال...";

        // إرسال البيانات للتلجرام
        tg.sendData(JSON.stringify({
          action: "verify_device",
          device_id: visitorId
        }));

        setTimeout(() => {
          tg.close();
        }, 500);

      } catch (error) {
        status.innerText = "❌ حدث خطأ أثناء التوثيق، حاول مجدداً.";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
