<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التحقق الأمني الذكي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
            border: 1px solid #334155;
        }
        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }
        h2 {
            margin-bottom: 5px;
            color: #38bdf8;
            font-size: 20px;
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .progress-box {
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            height: 10px;
            width: 100%;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0ea5e9, #6366f1);
            transition: width 0.4s ease;
        }
        .status-text {
            font-size: 13px;
            color: #cbd5e1;
            min-height: 25px;
        }
        .hidden {
            display: none;
        }
        .success {
            color: #4ade80;
            font-weight: bold;
            font-size: 16px;
        }
        .error {
            color: #f87171;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container" id="card">
        <div class="logo">🛡️</div>
        <h2>فحص أمان الجهاز</h2>
        <p>جاري التحقق من بصمة النظام ومنع الحسابات الوهمية...</p>
        
        <div class="progress-box">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="status-text" id="statusText">جاري تهيئة الاتصال الآمن...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const statusSteps = [
            "جاري فحص بصمة المتصفح ونظام التشغيل...",
            "تحليل كفاءة الأجهزة وتوافق المنصة...",
            "التحقق من سجل الأمان ومنع الحظر المزدوج...",
            "حفظ بيانات المعرف وإرسال البصمة للخادم..."
        ];

        let progressBar = document.getElementById("progressBar");
        let statusText = document.getElementById("statusText");
        let card = document.getElementById("card");

        function startAnalysis() {
            let progress = 0;
            let stepIndex = 0;

            let interval = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 5; // تقدم تدريجي ببطء
                if (progress > 100) progress = 100;

                progressBar.style.width = progress + "%";

                if (progress > 25 && progress < 50) stepIndex = 1;
                else if (progress >= 50 && progress < 80) stepIndex = 2;
                else if (progress >= 80) stepIndex = 3;

                statusText.innerText = statusSteps[stepIndex];

                if (progress === 100) {
                    clearInterval(interval);
                    completeVerification();
                }
            }, 300); // يستغرق الوقت الكافي للتحليل ببطء واحترافية
        }

        function completeVerification() {
            // توليد بصمة فريدة للجهاز أو جلبها المخزنة مسبقاً
            let deviceId = localStorage.getItem('secure_bot_device_id');
            if (!deviceId) {
                deviceId = 'dev_sec_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('secure_bot_device_id', deviceId);
            }

            // إرسال البيانات للبوت في الخلفية
            const payload = JSON.stringify({
                action: "verify_device",
                device_id: deviceId
            });

            if (tg && tg.sendData) {
                tg.sendData(payload);
                
                statusText.innerHTML = "<span class='success'>✅ تمت عملية التحقق بنجاح! جاري توجيهك...</span>";
                
                setTimeout(() => {
                    tg.close(); // إغلاق النافذة بعد نجاح الفحص
                }, 1500);
            } else {
                statusText.innerHTML = "<span class='error'>❌ يرجى فتح هذه الصفحة من داخل تليجرام حصراً.</span>";
            }
        }

        // بدء العملية تلقائياً عند فتح الصفحة
        window.onload = function() {
            setTimeout(startAnalysis, 500);
        };
    </script>
</body>
</html>
