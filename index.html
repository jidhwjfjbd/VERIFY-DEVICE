<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد أمان الجهاز</title>
    <!-- تضمين مكتبة تليجرام الـ Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 90%;
            width: 350px;
        }
        h2 {
            margin-bottom: 15px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>حماية البوت</h2>
        <p>انقر على الزر أدناه لتأكيد أمان جهازك والمتابعة إلى البوت لمرة واحدة فقط.</p>
        <button onclick="verifyAndClose()">تأكيد الأمان الآن</button>
    </div>

    <script>
        // تهيئة الـ Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        function verifyAndClose() {
            // توليد معرف فريد للجهاز أو تخزينه محلياً لثبات البصمة
            let deviceId = localStorage.getItem('bot_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('bot_device_id', deviceId);
            }

            // تجهيز البيانات وإرسالها للبوت
            const payload = JSON.stringify({
                action: "verify_device",
                device_id: deviceId
            });

            if (tg && tg.sendData) {
                tg.sendData(payload);
                // إغلاق النافذة فوراً لمنع التكرار
                tg.close();
            } else {
                alert("يرجى فتح هذه الصفحة من داخل تطبيق تليجرام حصراً.");
            }
        }
    </script>
</body>
</html>
