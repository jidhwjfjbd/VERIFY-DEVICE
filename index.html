<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحقق من أمان الجهاز</title>
  <!-- مكتبة تلجرام WebApp الرسمية -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- مكتبة بصمة الجهاز FingerprintJS -->
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 28px 20px;
      border-radius: 20px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #2a2a2a;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #b0b0b0;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }
    button:active {
      background-color: #006699;
    }
    button:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
    }
    .error { color: #ff5252; }
    .success { color: #4caf50; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h2>التحقق من أمان الجهاز</h2>
    <p>يرجى الضغط على الزر أدناه لتأكيد حماية حسابك ومنع الحسابات الوهمية.</p>
    <button id="verify-btn" onclick="verifyDevice()">تأكيد الجهاز الآن</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    // تهيئة كائن WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand(); // توسيع الشاشة للتناسب مع الهاتف
    }

    async function verifyDevice() {
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('verify-btn');
      
      statusDiv.className = 'status';
      statusDiv.innerText = '⏳ جاري قراءة بصمة الجهاز...';
      btn.disabled = true;

      try {
        // تحميل واستخراج البصمة
        const fp = await FingerprintJS.load();
        const result = await fp.get();
        const visitorId = result.visitorId;

        const payload = JSON.stringify({
          action: "verify_device",
          device_id: visitorId
        });

        // إرسال البصمة للبوت وإغلاق النافذة
        if (tg && tg.sendData) {
          tg.sendData(payload);
          statusDiv.className = 'status success';
          statusDiv.innerText = '✅ تم التوثيق بنجاح! جاري الإغلاق...';
          setTimeout(() => {
            tg.close();
          }, 400);
        } else {
          statusDiv.className = 'status error';
          statusDiv.innerText = '⚠️ يرجى فتح الصفحة من داخل تطبيق التلجرام حصراً.';
          btn.disabled = false;
        }
      } catch (err) {
        statusDiv.className = 'status error';
        statusDiv.innerText = '❌ حدث خطأ أثناء التحقق، حاول مرة أخرى.';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
