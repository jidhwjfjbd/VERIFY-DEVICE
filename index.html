<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد أمان الجهاز</title>
    <!-- تضمين مكتبة التيليجرام الرسمية للـ WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔒 تأكيد أمان الجهاز</h2>
        <p>انقر على الزر أدناه لإتمام التحقق وحفظ معرف جهازك بأمان.</p>
        <button onclick="verifyAndSendDevice()">تأكيد وإغلاق</button>
    </div>

    <script>
        function verifyAndSendDevice() {
            // توليد معرف فريد مؤقت للجهاز (يمكنك استبداله ببصمة حقيقية إذا رغبت)
            let deviceId = localStorage.getItem("device_id");
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                localStorage.setItem("device_id", deviceId);
            }

            // تجهيز البيانات بالهيكل المطلوب للبوت
            const payload = JSON.stringify({
                action: "verify_device",
                device_id: deviceId
            });

            // التأكد من فتح الصفحة داخل بيئة تيليجرام
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();
                
                // إرسال البيانات للبوت
                tg.sendData(payload);

                // إغلاق النافذة فوراً لمنع التكرار
                tg.close();
            } else {
                alert("يرجى فتح هذه الصفحة من داخل بوت تيليجرام حصراً.");
            }
        }
    </script>

</body>
</html>
